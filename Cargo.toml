[package]
name = "just-tile"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.8"
image = "0.25.5"
proj4rs = "0.1.10"
serde = { version = "1.0.228", features = ["derive"] }
tiff = "0.11.3"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "json"] }
futures = "0.3.31"
aws-config = "1.8.15"
aws-credential-types = "1.2.14"
aws-sigv4 = "1.4.2"
url = "2.5.8"
serde_json = "1.0.149"
http = "0.2"
